function nowID(){return new Date().toLocaleDateString('sv-SE',{timeZone:'Asia/Jakarta'});}
function dateISO(v) {
  if (v === null || v === undefined || v === '') return '';
  const text = String(v).normalize('NFKC')
    .replace(/[\u200B-\u200D\uFEFF]/g, '')
    .trim().toUpperCase()
    .replace(/^[\s✅✓✔☑\uFE0E\uFE0F]+|[\s✅✓✔☑\uFE0E\uFE0F]+$/g, '')
    .replace(/\s+/g, ' ').trim();

  // A two-digit year belongs to 2000–2099 for these production records.
  function validISO(year, month, day) {
    year = String(year).length === 2 ? 2000 + Number(year) : Number(year);
    month = Number(month);
    day = Number(day);
    if (!Number.isInteger(year) || year < 1000 || year > 9999 ||
        !Number.isInteger(month) || month < 1 || month > 12 ||
        !Number.isInteger(day) || day < 1 || day > 31) return '';
    const check = new Date(Date.UTC(year, month - 1, day));
    if (check.getUTCFullYear() !== year || check.getUTCMonth() !== month - 1 ||
        check.getUTCDate() !== day) return '';
    return `${year}-${String(month).padStart(2, '0')}-${String(day).padStart(2, '0')}`;
  }

  // Keep the numeric formats already used by the app and date inputs.
  let match = text.match(/^(\d{4})([-/])(\d{1,2})\2(\d{1,2})(?:[T ](?:[01]\d|2[0-3]):[0-5]\d(?::[0-5]\d(?:\.\d{1,9})?)?(?:Z|[+-](?:[01]\d|2[0-3]):?[0-5]\d)?)?$/);
  if (match) return validISO(match[1], match[3], match[4]);
  match = text.match(/^(\d{1,2})([-/])(\d{1,2})\2(\d{4}|\d{2})$/);
  if (match) return validISO(match[4], match[3], match[1]);

  // Legacy values include "✅ 06 OKT 26", "11 AGS 26", and "4 JUL 26".
  const months = {
    JAN: 1, JANUARI: 1, JANUARY: 1,
    FEB: 2, FEBRUARI: 2, FEBRUARY: 2,
    MAR: 3, MARET: 3, MARCH: 3,
    APR: 4, APRIL: 4,
    MEI: 5, MAY: 5,
    JUN: 6, JUNI: 6, JUNE: 6,
    JUL: 7, JULI: 7, JULY: 7,
    AGS: 8, AGT: 8, AGU: 8, AGST: 8, AGUST: 8, AGUSTUS: 8, AUG: 8, AUGUST: 8,
    SEP: 9, SEPT: 9, SEPTEMBER: 9,
    OKT: 10, OKTOBER: 10, OCT: 10, OCTOBER: 10,
    NOV: 11, NOVEMBER: 11,
    DES: 12, DESEMBER: 12, DEC: 12, DECEMBER: 12
  };
  match = text.match(/^(\d{1,2})[\s./-]*([A-Z]+)\.?[\s./-]*(\d{4}|\d{2})$/);
  if (match && Object.prototype.hasOwnProperty.call(months, match[2])) {
    return validISO(match[3], months[match[2]], match[1]);
  }
  // Unknown/partial-delivery notes (including SISA 100) are NOT full arrival dates.
  return '';
}

   <defs><linearGradient id="worldPlane" x1="0" y1="0" x2=".9" y2="1"><stop stop-color="#fdfdff"/><stop offset="1" stop-color="#e8ecff"/></linearGradient><linearGradient id="worldRoad" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#d6d9f3"/><stop offset="1" stop-color="#e1dafa"/></linearGradient><filter id="worldSoft" x="-30%" y="-30%" width="170%" height="170%"><feDropShadow dx="0" dy="6" stdDeviation="7" flood-color="#6264b3" flood-opacity=".1"/></filter></defs>
   <ellipse cx="590" cy="278" rx="520" ry="157" fill="#b1afe9" opacity=".12"/>
   <polygon points="75,289 493,85 1110,291 701,483" fill="url(#worldPlane)" stroke="#dbe1f7" stroke-width="2"/>
   <path d="M154 392Q400 494 627 393Q865 344 1050 410" stroke="#d5d8ef" stroke-width="52" fill="none" stroke-linecap="round"/>
   <path class="world-route" d="M154 392Q400 494 627 393Q865 344 1050 410" stroke="#ffffff" stroke-width="3" fill="none" stroke-linecap="round"/>
   <path d="M236 215Q400 120 585 247Q732 333 936 219" stroke="#d7dff1" stroke-width="13" fill="none" stroke-linecap="round" opacity=".8"/>
   <path class="world-track" d="M236 215Q400 120 585 247Q732 333 936 219" stroke="#acbdf3" stroke-width="3" fill="none" stroke-linecap="round"/>
   <g class="world-orb" fill="#b6a8ff" opacity=".5"><circle cx="145" cy="243" r="6"/><circle cx="1024" cy="269" r="5"/><circle cx="416" cy="173" r="4"/></g>
   ${factoryBuilding('TRIDAYA',225,218)}${factoryBuilding('INNA',565,166)}${factoryBuilding('KBI',905,224)}
   <g class="world-truck"><animateMotion dur="17s" repeatCount="indefinite" rotate="auto" path="M154 392 Q400 494 627 393 Q865 344 1050 410"/><g transform="translate(-18,-16)"><rect x="0" y="5" width="37" height="25" rx="5" fill="#7560f1"/><rect x="26" y="9" width="20" height="21" rx="3" fill="#fff"/><rect x="30" y="12" width="12" height="9" rx="1" fill="#99c9ef"/><circle class="wheel" cx="12" cy="31" r="5" fill="#354264"/><circle class="wheel" cx="34" cy="31" r="5" fill="#354264"/></g></g>
   <g class="world-truck"><animateMotion dur="20s" begin="-11s" repeatCount="indefinite" rotate="auto" path="M1050 410 Q865 344 627 393 Q400 494 154 392"/><g transform="translate(-18,-15)"><rect x="0" y="6" width="38" height="24" rx="6" fill="#22b994"/><rect x="30" y="10" width="19" height="20" rx="3" fill="#faffff"/><rect x="34" y="13" width="11" height="8" rx="1" fill="#a5c8ec"/><circle class="wheel" cx="12" cy="30" r="5" fill="#354264"/><circle class="wheel" cx="39" cy="30" r="5" fill="#354264"/></g></g>
   <g class="world-orb" transform="translate(471 367)"><rect x="-26" y="-12" width="48" height="24" rx="7" fill="#ffffff" stroke="#dddafa"/><path d="M-13 0h20m-10-6 6 6-6 6" fill="none" stroke="#8b73f8" stroke-width="2"/></g>
  </svg></div><div class="world-hint">${I('info',14)} Klik bangunan untuk memilih pabrik • Gunakan kontrol untuk animasi & zoom</div>
 </section>`;
}
function factoriesMotion(){const f=state.factory,rows=state.rows.filter(r=>r.pabrik===f),arrived=rows.filter(isArrived),open=rows.filter(isPending);
return heading('FACTORY NETWORK / ANIMATED','Factory universe','Jelajahi ilustrasi pabrik bergerak; angka dan daftar PO berasal dari Firebase MERCY.',`<button class="btn" data-action="factory-fullscreen">${I('zoom')} Layar penuh</button><button class="btn primary" data-action="factory-view-orders">${I('clipboard')} Lihat PO ${E(f)}</button>`)+initGuard()+factoryWorld()+`<div class="factory-facts">${FACTORIES.map(n=>{const xs=state.rows.filter(r=>r.pabrik===n),done=xs.filter(isArrived).length,pct=xs.length?Math.round(done/xs.length*100):0;return `<button class="factory-choice ${f===n?'active':''}" style="--fc:${factoryColor(n)};--pct:${pct}%" data-action="choose-factory" data-id="${n}"><span class="factory-icon">${I('factory',20)}</span><strong>${n}</strong><span>${fmt(xs.length)} PO</span><span class="factory-percent"><i></i></span></button>`;}).join('')}</div><div class="section-row"><h2>${f} <small>Live monitoring</small></h2><button class="btn small" data-action="factory-view-orders">Daftar ${E(f)} ${I('arrow',14)}</button></div><div class="kpi-grid">${stat('Total PO',state.ready?fmt(rows.length):'—','clipboard','','Semua status')}${stat('Belum datang',state.ready?fmt(open.length):'—','clock','blue','Tanggal barang datang kosong')}${stat('Urgent',state.ready?fmt(open.filter(r=>age(r)>=30).length):'—','alert','red','30+ hari belum datang')}${stat('Sudah datang',state.ready?fmt(arrived.length):'—','check','green','Tanggal datang terisi')}</div><div class="section-row"><h2>Purchase orders — ${f}<small>Terbaru</small></h2></div>${listTable([...rows].sort((a,b)=>b.tgl.localeCompare(a.tgl)),12)}<p class="micro" style="margin-top:12px">Bangunan, truk, dan pergerakan hanya visualisasi. Status dan jumlah menggunakan data PO yang ada; bukan sensor aktivitas produksi fisik.</p>`;
}
function commandResults(q){const query=String(q||'').trim().toLowerCase();const matches=query?state.rows.filter(r=>[r.design,r.warna,r.kode,r.nomorPo,r.customer,r.id].join(' ').toLowerCase().includes(query)).slice(0,6):[...state.rows].sort((a,b)=>b.tgl.localeCompare(a.tgl)).slice(0,4);
 const motifs=query?state.motifs.filter(m=>[m.name,m.color,m.code].join(' ').toLowerCase().includes(query)).slice(0,5):state.motifs.slice(0,3);
 let out='';if(matches.length)out+=`<div class="command-section">PURCHASE ORDERS · ${matches.length} hasil</div>${matches.map(r=>`<button class="command-result" data-action="command-po" data-id="${E(r.id)}"><span class="command-icon">${I('clipboard',17)}</span><span><strong>${E(r.design)}</strong><small>${E(r.pabrik)} · ${E(r.nomorPo||r.kode||r.id.slice(0,10))} · ${dateText(r.tgl)}</small></span>${I('arrow',15)}</button>`).join('')}`;
 if(motifs.length)out+=`<div class="command-section">KATALOG MOTIF · ${motifs.length} hasil</div>${motifs.map(m=>`<button class="command-result" data-action="command-motif" data-id="${E(m.id)}"><span class="command-icon">${I('image',17)}</span><span><strong>${E(m.name)}</strong><small>${E(m.color||'Tanpa warna')} · ${fmt(m.rows.length)} PO</small></span>${I('arrow',15)}</button>`).join('')}`;
 return out||'<div class="command-empty">Tidak ada motif atau PO yang sesuai pencarian.</div>';
}
function commandMarkup(){return `<div class="backdrop" data-action="backdrop"><section class="modal command-modal" role="dialog" aria-modal="true" aria-label="Pencarian cepat MERCY"><div class="modal-head"><div><div class="eyebrow">QUICK FIND / MERCY</div><h2>Temukan motif atau PO</h2><p>Cari data asli tanpa mengubah apapun di Firebase.</p></div><button class="modal-close" data-action="close-modal">${I('close',18)}</button></div><div class="modal-body"><div class="command-input-wrap">${I('search',20)}<input data-command-query type="search" autocomplete="off" placeholder="Ketik nama motif, warna, nomor PO…" aria-label="Cari motif atau PO"/><span class="keycap">ESC</span></div><div class="command-list" id="command-results">${commandResults('')}</div><div class="command-instruction">Klik hasil untuk membuka detail · Ctrl / ⌘ + K untuk mencari lagi</div></div></section></div>`;}
function animateNumbers(){if(window.matchMedia?.('(prefers-reduced-motion: reduce)').matches||document.body.classList.contains('motion-off'))return;
 root.querySelectorAll('.kpi-value').forEach(el=>{const content=el.textContent.trim(),raw=content.replace(/\./g,'');if(!/^\d+$/.test(raw))return;const target=Number(raw);if(!Number.isFinite(target)||target>999999999999)return;const duration=800,start=performance.now();function frame(t){if(!el.isConnected)return;const r=Math.min(1,(t-start)/duration),e=1-Math.pow(1-r,4);el.textContent=fmt(Math.round(target*e));if(r<1)requestAnimationFrame(frame);}requestAnimationFrame(frame);});
}
function syncSceneState(){const svg=root.querySelector('.world-svg');if(svg&&(state.scenePaused||document.body.classList.contains('motion-off')))try{svg.pauseAnimations();}catch(e){} }

render();connectFirebase();

</script>
