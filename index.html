function motifGridItem(m,idx){const isSelected=ui.selected===m.id;return `<button class="motif-card ${isSelected?'selected':''}" data-action="select-motif" data-id="${esc(m.id)}" aria-label="Pilih motif ${esc(m.name)}"><div class="motif-photo">${thumb(m,'tile-image').replace('class="tile-image"','class="tile-image" style="width:100%;height:100%;object-fit:cover"')}<span class="photo-num">${String(idx+1).padStart(2,'0')}</span><span class="favourite">${I('heart',14)}</span></div><div class="motif-info"><div class="motif-name">${esc(m.name)}</div><div class="motif-code">${esc(m.code)} &nbsp; · &nbsp; ${m.colors.length} warna</div><div class="motif-bottom"><span class="live">● Aktif</span><span>${countOrders(m)} PO terkait</span></div></div></button>`}
function motifInspector(m){if(!m)return `<aside class="card inspector"><div class="empty">Pilih satu motif untuk melihat detail.</div></aside>`;return `<aside class="card inspector"><div class="inspector-h"><span>Quick preview</span><button class="head-icon" style="height:27px;width:27px" data-action="motif-detail" data-id="${esc(m.id)}">${I('external',17)}</button></div><div data-action="open-photo" data-id="${esc(m.id)}" style="cursor:zoom-in">${thumb(m,'ins-img')}</div><div style="padding:16px 2px 2px"><div style="display:flex;gap:6px"><span class="badge purple">SELECTED</span><span class="badge green">● Aktif</span></div><div class="ins-name">${esc(m.name)}</div><div class="ins-code">${esc(m.code)} &nbsp;/&nbsp; ${esc(m.kind)} collection</div><div class="swatches">${m.colors.map(x=>`<span class="swatch" style="background:${colorHex(x)}" title="${esc(x)}"></span>`).join('')}<span class="micro" style="margin-left:7px">${esc(m.colors.join(', '))}</span></div><div class="ins-row"><span>Foto utama</span><b>${imgOf(m)?'1 gambar':'Belum diunggah'}</b></div><div class="ins-row"><span>PO terkait</span><b>${fmt(countOrders(m))} orders</b></div><div class="ins-row"><span>Pabrik</span><b>${[...new Set(orders.filter(o=>o.motifId===m.id).map(o=>o.factory))].join(', ')||'—'}</b></div><div class="ins-actions"><button class="btn pale" data-action="motif-detail" data-id="${esc(m.id)}">Detail ${I('arrow',14)}</button><button class="btn" data-action="upload-photo" data-id="${esc(m.id)}" title="Ganti foto">${I('upload',14)}</button></div></div></aside>`}
function motifsPage(){const visible=motifVisible();let selected=motifById(ui.selected);if(!selected||!visible.some(m=>m.id===selected.id))selected=visible[0];return `${heading('Your designs, organized','Motif library','Semua motif dalam satu galeri — terhubung otomatis ke setiap PO dan produksi.',`<button class="btn primary" data-action="add-motif">${I('plus')} Tambah motif</button>`)}${libHero()}<div class="section-row lib-section"><h2>Explore collections <small>${visible.length} motifs</small></h2><div class="view-toggle"><button data-action="switch-view" data-view="grid" class="${ui.view==='grid'?'active':''}">${I('grid2',14)} Grid</button><button data-action="switch-view" data-view="list" class="${ui.view==='list'?'active':''}">${I('list',14)} List</button></div></div><div class="filter-tools"><label class="search-input">${I('search',16)}<input type="search" data-filter="motif-query" placeholder="Cari nama motif, kode desain atau warna..." value="${esc(ui.motifQuery)}"/></label><select class="select" data-filter="motif-kind"><option value="all">Semua kategori</option>${['Character','Floral','Abstract','Lainnya'].map(x=>`<option value="${x}" ${ui.motifKind===x?'selected':''}>${x}</option>`).join('')}</select><select class="select" data-filter="motif-factory"><option value="all">Semua pabrik</option>${factories.map(x=>`<option ${ui.motifFactory===x?'selected':''}>${x}</option>`).join('')}</select><button class="sbtn" data-action="reset-motif-filters" title="Reset filter">${I('filter',17)}</button></div><div class="library-wrap"><div class="${ui.view==='grid'?'library-cards':'motif-list'}">${visible.length?visible.map(motifGridItem).join(''):`<div class="card empty" style="grid-column:1/-1">${I('search',30)}<strong>Tidak ada motif ditemukan</strong><small>Coba ubah kata kunci atau filter.</small></div>`}</div>${motifInspector(selected)}</div>`}
function ordersFiltered(){const q=ui.ordersQuery.toLowerCase().trim();return orders.filter(o=>{const m=motifOf(o);return(!q||[o.id,m.name,m.code,o.color,o.customer].join(' ').toLowerCase().includes(q))&&(ui.ordersFactory==='all'||o.factory===ui.ordersFactory)&&(!ui.ordersStatuses.length||ui.ordersStatuses.includes(o.status))}).sort((a,b)=>b.date.localeCompare(a.date))}
function poTableRows(list){return list.map(o=>{const m=motifOf(o);return `<tr><td><div class="po-design">${thumb(m)}<div><div class="text-bold">${esc(m.name)}</div><div class="micro" style="margin-top:5px">${esc(m.code)} · ${esc(o.color)}</div></div></div></td><td><span class="text-bold">${esc(o.id)}</span><div class="micro" style="margin-top:4px">${idDate(o.date)}</div></td><td><span class="factory-dot" style="background:${factoryColor(o.factory)}"></span>${esc(o.factory)}</td><td>${fmt(o.qty)} pcs</td><td>${statusBadge(o.status)}</td><td>${ageBadge(o)}</td><td>${o.arrived?idDate(o.arrived):'—'}</td><td><button class="txt-btn" data-action="edit-po" data-id="${esc(o.id)}">${I('edit',15)} Edit</button></td></tr>`}).join('')}
function ordersPage(){const f=ordersFiltered();const active=f.filter(isOpen).length;const urgent=f.filter(o=>isOpen(o)&&days(o.date)>=30).length;return `${heading('Production / Order tracking','Purchase orders','Pantau desain, status produksi, dan kedatangan barang dari semua pabrik.',`<button class="btn" data-action="import-csv">${I('upload')} Impor CSV</button><button class="btn" data-action="export">${I('download')} Ekspor CSV</button><button class="btn primary" data-action="add-po">${I('plus')} Tambah PO</button>`)}<div class="po-stats"><div class="card"><span class="labelcaps">HASIL FILTER</span><strong>${fmt(f.length)} <span class="micro">PO</span></strong><small>Pesanan yang ditampilkan</small></div><div class="card"><span class="labelcaps">MASIH BERJALAN</span><strong>${fmt(active)} <span class="micro">PO</span></strong><small>Belum tercatat barang datang</small></div><div class="card"><span class="labelcaps">PERLU DIKEJAR</span><strong style="color:#ed6b7b">${fmt(urgent)} <span class="micro">PO</span></strong><small>Usia 30+ hari, belum datang</small></div></div><div class="status-filters"><button class="filter-pill ${ui.ordersStatuses.length===0?'selected':''}" data-action="filter-po-status" data-status="all">Semua status <b>${orders.length}</b></button>${statuses.map(s=>`<button class="filter-pill ${ui.ordersStatuses.includes(s)?'selected':''}" data-action="filter-po-status" data-status="${s}">${s}<b>${orders.filter(o=>o.status===s).length}</b></button>`).join('')}</div><div class="big-table"><div class="table-top"><label class="search-input">${I('search',17)}<input type="search" data-filter="orders-query" placeholder="Cari desain, nomor PO, atau kode..." value="${esc(ui.ordersQuery)}"/></label><select class="select" data-filter="orders-factory"><option value="all">Semua pabrik</option>${factories.map(x=>`<option ${ui.ordersFactory===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn small" data-action="reset-order-filters">${I('reset',14)} Reset filter</button><span class="filter-result">${f.length} dari ${orders.length} PO</span></div><div class="scroll-table">${f.length?`<table class="status-table"><thead><tr><th>Desain / motif</th><th>No. PO / Tanggal</th><th>Pabrik</th><th>Quantity</th><th>Status</th><th>Usia PO</th><th>Barang datang</th><th>Aksi</th></tr></thead><tbody>${poTableRows(f)}</tbody></table>`:`<div class="empty"><span class="empty-icon">${I('search',26)}</span><strong>PO tidak ditemukan</strong><small>Coba ubah status, pabrik, atau pencarian.</small></div>`}</div><div style="padding:14px 17px;border-top:1px solid #edf0f5;font-size:10px;color:#97a4b8">${I('info',13)} Usia dihitung dari tanggal PO; belum datang 30+ hari diprioritaskan. Semua data di sini simulasi.</div></div>`}
function isoFactory(f,x,y){const selected=f===ui.factory;const accent=factoryColor(f);const color2=f==='Tridaya'?'#a998f5':f==='Inna'?'#70c0d6':'#f6c47d';const roof=f==='Tridaya'?'#8270d7':f==='Inna'?'#4ca6bd':'#dfa65d';return `<g class="svg-factory" data-action="choose-factory" data-id="${f}" tabindex="0" role="button" aria-label="Pilih pabrik ${f}"><ellipse cx="${x}" cy="${y+144}" rx="135" ry="47" fill="${accent}" opacity=".09"/><path d="M${x-110} ${y+12}l110 -63 110 63 -110 65Z" fill="${roof}"/><path d="M${x-110} ${y+12}l110 65v99l-110 -63Z" fill="${color2}"/><path d="M${x} ${y+77}l110 -65v101l-110 63Z" fill="${accent}"/><path d="M${x-110} ${y+12}l110 -63 110 63" fill="none" stroke="white" stroke-width="3" opacity=".3"/><path d="M${x-79} ${y-12}l80 -46 80 46 -80 47Z" fill="${accent}" opacity=".3"/><path d="M${x-34} ${y+103}l34 19v54l-34 -20Z" fill="#f5f4ff" opacity=".86"/><path d="M${x+22} ${y+92}l20 -11v21l-20 12Z M${x+57} ${y+72}l20 -11v21l-20 12Z M${x+22} ${y+127}l20 -11v20l-20 12Z M${x+57} ${y+107}l20 -11v20l-20 12Z" fill="#fff" opacity=".78"/><path d="M${x-66} ${y+70}l22 13v22l-22 -12Z" fill="#fff" opacity=".73"/><rect x="${x-15}" y="${y-28}" width="31" height="7" rx="3" fill="#fff" opacity=".3"/><path d="M${x-70} ${y-12}l16 -9 16 9 -16 9Z" fill="#fff" opacity=".35"/><ellipse cx="${x-45}" cy="${y+161}" rx="25" ry="8" fill="${accent}" opacity=".15"/><polygon points="${x-73},${y+143} ${x-47},${y+128} ${x-21},${y+143} ${x-47},${y+158}" fill="${roof}"/><path d="M${x-73} ${y+143}l26 15v19l-26 -15Z" fill="${color2}"/><path d="M${x-47} ${y+158}l26 -15v19l-26 15Z" fill="${accent}"/><text x="${x}" y="${y+219}" font-size="18" font-weight="780" text-anchor="middle" fill="#48516c">${f.toUpperCase()}</text><text x="${x}" y="${y+238}" font-size="11" text-anchor="middle" fill="#98a4bd">${orders.filter(o=>o.factory===f&&isOpen(o)).length} open PO</text>${selected?`<rect x="${x-119}" y="${y-68}" width="238" height="308" rx="17" fill="none" stroke="${accent}" stroke-width="2.5" stroke-dasharray="5 5" opacity=".45"/>`:''}</g>`}
function factorySVG(){return `<div class="floor-panel"><div class="factory-ambient">${I('layers',14)} &nbsp; INTERACTIVE FACTORY VIEW</div><svg class="factory-svg" viewBox="0 0 1120 360" xmlns="http://www.w3.org/2000/svg" role="img" aria-label="Tiga ilustrasi pabrik isometrik Tridaya, Inna, dan KBI. Klik untuk memfilter."><defs><pattern id="floor-gr" width="34" height="34" patternUnits="userSpaceOnUse" patternTransform="skewY(-25)"><path d="M 34 0 L 0 0 0 34" fill="none" stroke="#c7d2f4" stroke-width=".6" opacity=".5"/></pattern></defs><ellipse cx="561" cy="210" rx="600" ry="220" fill="#ddd8ff" opacity=".22"/><rect width="1120" height="360" fill="url(#floor-gr)" opacity=".38"/><path d="M110 268 Q 555 342 1025 256" fill="none" stroke="#afa8e5" stroke-width="4" stroke-dasharray="12 13" opacity=".6"/>${isoFactory('Tridaya',203,112)}${isoFactory('Inna',559,112)}${isoFactory('KBI',915,112)}</svg></div>`}
function factoriesPage(){const f=ui.factory;const rows=orders.filter(o=>o.factory===f).sort((a,b)=>b.date.localeCompare(a.date));const open=rows.filter(isOpen);const arrived=rows.filter(o=>o.arrived||o.status==='DATANG');return `${heading('Manufacturing network','Factory floor','Visualisasi 3 pabrik MERCY. Pilih bangunan atau kartu untuk memeriksa detail pesanan.',`<button class="btn" data-nav="orders">${I('clipboard')} Buka daftar PO</button><button class="btn primary" data-action="add-po">${I('plus')} Tambah PO</button>`)}${factorySVG()}<div class="factory-cards">${factories.map(x=>{const arr=orders.filter(o=>o.factory===x),act=arr.filter(isOpen).length,done=arr.filter(o=>o.arrived||o.status==='DATANG').length,pct=arr.length?done/arr.length*100:0;return `<button class="card factory-card ${ui.factory===x?'active':''}" data-action="choose-factory" data-id="${x}" style="text-align:left"><div class="name"><span><i class="factory-dot" style="background:${factoryColor(x)}"></i>${x}</span>${I('arrow',16)}</div><div class="num">${fmt(act)} <span class="micro">PO aktif</span></div><div class="tiny">${arr.length} total pesanan · ${done} sudah datang</div><div class="track"><div style="width:${pct}%;background:${factoryColor(x)}"></div></div></button>`}).join('')}</div><div class="section-row"><h2>Pesanan ${f} <small>${rows.length} PO tercatat</small></h2><button class="btn small" data-action="filter-factory-orders" data-id="${f}">Lihat semua PO ${I('arrow',14)}</button></div>${shortTable(rows.slice(0,6))}`}
function taskItem(o){const m=motifOf(o);return `<div class="task-item">${thumb(m,'po-thumb')}<div class="task-text"><strong>${esc(m.name)}</strong><small>${esc(o.id)} · ${esc(o.factory)} · ${fmt(o.qty)} pcs</small><small>Status: ${esc(o.status)} · ${idDate(o.date)}</small></div><div class="right">${ageBadge(o)}<div style="display:flex;gap:6px"><button class="btn small" data-action="edit-po" data-id="${esc(o.id)}">Detail</button><button class="btn small pale" data-action="mark-arrived" data-id="${esc(o.id)}">Tiba ${I('check',12)}</button></div></div></div>`}
function followPage(){const all=orders.filter(o=>isOpen(o)&&(ui.followFactory==='all'||o.factory===ui.followFactory));const red=all.filter(o=>days(o.date)>=30).sort((a,b)=>days(b.date)-days(a.date));const yellow=all.filter(o=>days(o.date)>=14&&days(o.date)<30).sort((a,b)=>days(b.date)-days(a.date));const fresh=all.filter(o=>days(o.date)<14);return `${heading('Operations / Daily priorities','Priority queue','Prioritaskan pesanan yang belum tiba berdasarkan usia PO dan pabrik.',`<select class="select" data-filter="follow-factory" style="max-width:175px"><option value="all">Semua pabrik</option>${factories.map(x=>`<option ${ui.followFactory===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" data-action="print">${I('print')} Cetak</button>`)}<div class="focus-banner"><div class="focus-icon">${I('alert',27)}</div><div><strong>${red.length} PO perlu follow up segera</strong><p>Usia 30+ hari dan belum ada tanggal barang datang. Tidak otomatis berarti melewati tenggat.</p></div><span class="badge red push">HIGH PRIORITY</span></div><div class="task-grid"><section class="card cardpad"><div class="section-row" style="margin:0 0 9px"><h2>Segera ditindaklanjuti</h2><span class="badge red">${red.length} PO</span></div>${red.length?red.map(taskItem).join(''):`<div class="empty"><strong>Tidak ada PO prioritas tinggi</strong><small>Seluruh PO lama sudah ditindaklanjuti.</small></div>`}</section><section class="card cardpad"><div class="section-row" style="margin:0 0 9px"><h2>Dalam pemantauan</h2><span class="badge yellow">${yellow.length} PO</span></div>${yellow.length?yellow.map(taskItem).join(''):`<div class="empty"><strong>Tidak ada PO usia 14–29 hari</strong></div>`}</section></div><div class="section-row"><h2>Pesanan baru <small>0–13 hari</small></h2></div>${shortTable(fresh.sort((a,b)=>b.date.localeCompare(a.date)).slice(0,8))}`}
function reportsPage(){const f=ui.reportFactory;const r=orders.filter(o=>f==='all'||o.factory===f);const open=r.filter(isOpen);const done=r.filter(o=>o.arrived||o.status==='DATANG');const cancel=r.filter(o=>o.status==='CANCEL');const risk=open.filter(o=>days(o.date)>=30);const statusSegments=[{name:'Sedang proses',num:open.filter(o=>!['SO','REV SO'].includes(o.status)).length,color:'#795ef5'},{name:'SO / Revisi',num:open.filter(o=>['SO','REV SO'].includes(o.status)).length,color:'#f6b66c'},{name:'Barang datang',num:done.length,color:'#1ebc95'},{name:'Dibatalkan',num:cancel.length,color:'#dce1eb'}];const pc=r.length?statusSegments.map(x=>x.num/r.length*100):[0,0,0,0];let p=0;const gradient='conic-gradient('+statusSegments.map((x,i)=>{const start=p;p+=pc[i];return `${x.color} ${start}% ${p}%`}).join(',')+')';const maxFactory=Math.max(1,...factories.map(x=>r.filter(o=>o.factory===x).length));return `${heading('Insights / Production analytics','Production reports','Rangkuman visual untuk membantu keputusan dan follow up harian.',`<select class="select" data-filter="report-factory"><option value="all">Semua pabrik</option>${factories.map(x=>`<option ${ui.reportFactory===x?'selected':''}>${x}</option>`).join('')}</select><button class="btn" data-action="export">${I('download')} Ekspor CSV</button><button class="btn primary" data-action="print">${I('print')} Cetak laporan</button>`)}<div class="kpi-grid">${stat('Total PO',fmt(r.length),'clipboard','','Berdasarkan pabrik terpilih')}${stat('PO belum datang',fmt(open.length),'clock','blue','Di luar status batal')}${stat('Perlu follow up',fmt(risk.length),'alert','red','Berusia 30+ hari')}${stat('Total unit',fmt(totalQty(r)),'box','green','Total QTY terisi')}</div><div class="chart-grid" style="margin-top:18px"><section class="card cardpad"><div class="section-row" style="margin:0 0 28px"><h2>Sebaran status PO</h2><span class="badge purple">CURRENT DATA</span></div><div class="donut" style="background:${gradient}"><div class="donut-hole"><strong>${r.length}</strong><small class="micro">TOTAL PO</small></div></div><div class="legend">${statusSegments.map(x=>`<div class="legend-row"><span><i class="swatch-dot" style="background:${x.color}"></i>${x.name}</span><b>${x.num}</b></div>`).join('')}</div></section><section class="card cardpad"><div class="section-row" style="margin:0 0 25px"><h2>Distribusi pabrik</h2><span class="micro">Jumlah PO</span></div>${factories.map(x=>{const c=r.filter(o=>o.factory===x).length;return `<div class="bar-report"><label><span class="factory-dot" style="background:${factoryColor(x)}"></span>${x}</label><div class="track"><div style="width:${c/maxFactory*100}%;background:${factoryColor(x)}"></div></div><b>${c} PO</b></div>`}).join('')}<div class="line" style="margin:32px 0 21px"></div><div class="labelcaps">Ringkasan hasil</div><div style="display:grid;grid-template-columns:1fr 1fr;gap:13px;margin-top:14px"><div style="padding:15px;background:#f8f7ff;border-radius:12px"><strong style="font-size:23px">${r.length?Math.round(done.length/r.length*100):0}%</strong><small style="display:block;color:#a0acc0;margin-top:5px">PO barang datang</small></div><div style="padding:15px;background:#fff6f3;border-radius:12px"><strong style="font-size:23px">${r.length?Math.round(risk.length/r.length*100):0}%</strong><small style="display:block;color:#a0acc0;margin-top:5px">PO perlu follow up</small></div></div></section></div><div class="section-row"><h2>Daftar untuk laporan <small>${r.length} PO</small></h2></div>${shortTable([...r].sort((a,b)=>b.date.localeCompare(a.date)).slice(0,10))}`}
function inputField(label,id,placeholder='',value='',required=false,type='text',extra=''){return `<div class="field ${extra}"><label for="${id}">${label}${required?' *':''}</label><input id="${id}" name="${id}" type="${type}" placeholder="${esc(placeholder)}" value="${esc(value)}" ${required?'required':''}/></div>`}
function selectField(label,id,options,value='',required=false,extra=''){return `<div class="field ${extra}"><label for="${id}">${label}${required?' *':''}</label><select id="${id}" name="${id}" ${required?'required':''}>${options.map(x=>`<option value="${esc(x)}" ${value===x?'selected':''}>${esc(x)}</option>`).join('')}</select></div>`}
function formFoot(text='Simpan data demo'){return `<div class="modal-foot"><button class="btn" type="button" data-action="close-modal">Batal</button><button class="btn primary" type="submit">${I('check',15)} ${text}</button></div>`}
function renderModal(){if(!ui.modal)return '';const model=ui.modal;const type=model.type;let title='',subtitle='',body='',width='';
if(type==='motif'){title='Tambah motif baru';subtitle='Nama, kode desain, dan gambar utama untuk katalog.';body=`<form data-form="motif"><div class="form-grid">${inputField('Nama motif','name','Contoh: Bunny Bloom','',true)}${inputField('Kode desain','code','Contoh: DGT-1050','',true)}${selectField('Kategori','kind',['Character','Floral','Abstract','Lainnya'],'Character',true)}${inputField('Variasi warna (pisahkan koma)','colors','Pink, Cream, Blue','',false,'text','full')}<div class="field full"><label>Foto motif (opsional)</label><label class="upload-box" for="motif-photo-upload"><img id="motif-upload-preview" class="upload-preview" alt="Preview upload"/><div>${I('upload',27)}</div><div><strong>Pilih gambar motif dari komputer</strong><small>JPG / PNG / WebP. Otomatis dikecilkan untuk demo.</small></div></label><input style="display:none" type="file" id="motif-photo-upload" accept="image/*" data-image-input="1"/></div></div>${formFoot('Tambah motif')}</form>`}
else if(type==='edit-photo'){const m=motifById(model.id);title='Perbarui foto motif';subtitle=`${m?m.name:''} · Upload foto baru sebagai gambar utama.`;body=`<form data-form="photo"><div class="field full"><label>Pilih gambar</label><label class="upload-box" for="motif-photo-upload"><img id="motif-upload-preview" class="upload-preview ${m&&imgOf(m)?'shown':''}" src="${m?imgOf(m):''}" alt="Foto motif"/><div>${I('upload',27)}</div><div><strong>Klik untuk mengganti foto motif</strong><small>File hanya tersimpan di browser lokal.</small></div></label><input style="display:none" type="file" id="motif-photo-upload" accept="image/*" data-image-input="1"/></div>${formFoot('Simpan foto')}</form>`}
else if(type==='po'){const o=model.id?orders.find(x=>x.id===model.id):null;title=o?'Edit purchase order':'Tambah purchase order';subtitle=o?`Nomor PO: ${o.id}`:'Pilih motif yang sudah tersimpan agar gambar otomatis terhubung.';const motifOpts=motifs.map(x=>x.id);body=`<form data-form="po" data-id="${o?esc(o.id):''}"><div class="form-grid"><div class="field full"><label for="motifId">Desain / Motif *</label><select id="motifId" name="motifId" required>${motifs.map(m=>`<option value="${esc(m.id)}" ${o&&o.motifId===m.id?'selected':''}>${esc(m.name)} · ${esc(m.code)}</option>`).join('')}</select></div>${selectField('Pabrik','factory',factories,o?o.factory:'Tridaya',true)}${selectField('Status','status',statuses,o?o.status:'SO',true)}${inputField('Tanggal PO','date','',o?o.date:'2026-10-26',true,'date')}${inputField('Quantity (pcs)','qty','2000',o?o.qty:'',true,'number')}${inputField('Warna','color','Pink',o?o.color:'',false)}${inputField('Pelanggan','customer','Mercy',o?o.customer:'Mercy',true)}${inputField('Harga / unit (Rp)','price','15000',o?o.price:'',false,'number')}${inputField('Barang datang','arrived','',o?o.arrived:'',false,'date')}<div class="field full"><label for="note">Catatan</label><textarea id="note" name="note" placeholder="Informasi tambahan untuk pabrik...">${esc(o?o.note:'')}</textarea></div></div>${formFoot(o?'Simpan perubahan':'Tambah PO')}</form>${o?`<div style="padding-top:12px;display:flex;justify-content:space-between;align-items:center"><span class="micro">Aksi hanya mengubah data demo.</span><button class="btn small danger" data-action="delete-po" data-id="${esc(o.id)}">${I('trash',14)} Hapus PO</button></div>`:''}`;width='wide'}
else if(type==='motif-detail'){const m=motifById(model.id);if(!m)return '';title='Detail motif';subtitle='Gambar, informasi desain, dan hubungan PO.';body=`<div class="ins-detail"><div><div data-action="open-photo" data-id="${esc(m.id)}" style="cursor:zoom-in">${thumb(m,'detail-image')}</div><div class="micro" style="margin-top:8px">${I('zoom',12)} Klik gambar untuk memperbesar</div></div><div><span class="badge purple">${esc(m.kind)} collection</span><div class="detail-title">${esc(m.name)}</div><div class="detail-desc">${esc(m.code)} &nbsp; · &nbsp; ${esc(m.colors.join(' / '))}</div><div class="line" style="margin:24px 0 11px"></div><div class="ins-row"><span>Status motif</span><b>Aktif</b></div><div class="ins-row"><span>PO terkait</span><b>${countOrders(m)} PO</b></div><div class="ins-row"><span>Kategori</span><b>${esc(m.kind)}</b></div><div class="ins-row"><span>Gambar utama</span><b>${imgOf(m)?'Tersedia':'Belum ada'}</b></div><button class="btn primary" style="width:100%;margin-top:20px" data-action="motif-orders" data-id="${esc(m.id)}">Lihat PO motif ini ${I('arrow',15)}</button><button class="btn" style="width:100%;margin-top:9px" data-action="upload-photo" data-id="${esc(m.id)}">${I('upload',15)} Ubah foto</button></div></div>`;width='wide'}
else if(type==='photo-zoom'){const m=motifById(model.id);title=m?m.name:'Preview foto';subtitle='Tampilan gambar motif dalam ukuran besar.';body=`<div>${thumb(m,'detail-image')}</div>`;width='zoom-modal'}
else if(type==='notifications'){title='Activity center';subtitle='Notifikasi contoh dari data simulasi.';const urg=orders.filter(o=>isOpen(o)&&days(o.date)>=30);body=`<div class="focus-banner"><div class="focus-icon">${I('bell',25)}</div><div><strong>${urg.length} PO perlu perhatian</strong><p>Beberapa PO belum tercatat tanggal barang datang.</p></div></div>${urg.slice(0,5).map(orderMini).join('')}<div style="margin-top:17px"><button class="btn primary" data-nav="followup">Buka prioritas ${I('arrow',14)}</button></div>`}
else if(type==='settings'){title='Pengaturan prototype';subtitle='Demo ini tidak terhubung ke database MERCY asli.';body=`<div class="card" style="padding:17px;background:#f7f5ff"><div style="display:flex;gap:12px;align-items:flex-start;color:#7054ec">${I('shield',23)}<div><strong>Mode demo aman</strong><p class="subtitle" style="margin:7px 0 0">Tambah motif, foto, dan PO hanya disimpan di localStorage browser ini. Tidak ada data yang dikirim ke Firebase atau website aktif.</p></div></div></div><button class="btn danger" data-action="reset-all" style="margin-top:18px">${I('reset',15)} Reset seluruh data demo</button>`}
else if(type==='import'){title='Impor file CSV';subtitle='Untuk pratinjau — tidak akan mengubah data pada website MERCY aktif.';body=`<div class="card" style="padding:20px;margin-bottom:12px"><div class="field"><label for="csv-upload">Pilih CSV dari Excel</label><input id="csv-upload" type="file" accept=".csv,text/csv" data-csv-input="1"/></div><p class="subtitle" style="margin-top:12px">Kolom yang didukung: TGL, DESAIN/DESIGN, PABRIK, QTY, KET/STATUS, WARNA, CUSTOMER/PELANGGAN, NOMOR PO. CSV ditambahkan sebagai data lokal demo.</p></div><div id="csv-result" class="muted" style="font-size:12px">Belum ada file dipilih.</div>`}
return `<div class="backdrop" data-action="backdrop"><div class="modal ${width}" role="dialog" aria-modal="true" aria-label="${esc(title)}"><div class="modal-head"><div><div class="eyebrow">MERCY STUDIO / DEMO</div><h2>${title}</h2><p>${subtitle}</p></div><button class="modal-close" data-action="close-modal" title="Tutup">${I('close',19)}</button></div><div class="modal-body">${body}</div></div></div>`}
function pageContent(){return ({overview,motifs:motifsPage,orders:ordersPage,factories:factoriesPage,followup:followPage,reports:reportsPage}[ui.page]||overview)()}
const root=document.getElementById('app');
function render(keepFocus=false){let fId=null,selectionStart=null,selectionEnd=null;if(keepFocus){const el=document.activeElement;if(el&&el.hasAttribute('data-filter')){fId=el.getAttribute('data-filter');if(el.selectionStart!==undefined){selectionStart=el.selectionStart;selectionEnd=el.selectionEnd}}}root.innerHTML=shell(pageContent());if(fId){const newEl=root.querySelector(`[data-filter="${fId}"]`);if(newEl){newEl.focus();if(selectionStart!==null&&newEl.setSelectionRange){try{newEl.setSelectionRange(selectionStart,selectionEnd)}catch(e){}}}}}
let toastTimeout;function toast(message){const old=document.querySelector('.toast');if(old)old.remove();const el=document.createElement('div');el.className='toast';el.innerHTML=I('check',18)+`<span>${esc(message)}</span>`;document.body.appendChild(el);clearTimeout(toastTimeout);toastTimeout=setTimeout(()=>el.remove(),3100)}
function navigate(p){ui.page=p;ui.modal=null;ui.pendingImage=null;document.body.style.overflow='';window.scrollTo({top:0,behavior:'instant'});render()}
function openModal(type,id=null){ui.pendingImage=null;ui.modal={type,id};render();document.body.style.overflow='hidden'}
function closeModal(){ui.modal=null;ui.pendingImage=null;document.body.style.overflow='';render()}
function csvEncode(v){const s=String(v??'');return '"'+s.replaceAll('"','""')+'"'}
function exportCsv(){const f=ui.page==='orders'?ordersFiltered():ui.page==='reports'?orders.filter(o=>ui.reportFactory==='all'||o.factory===ui.reportFactory):orders;const h=['TGL','PABRIK','DESAIN','WARNA','QTY','CUSTOMER','BARANG DATANG','KODE','NOMOR PO','STATUS','HARGA','JUMLAH'];const content=[h,...f.map(o=>{const m=motifOf(o);return[o.date,o.factory,m.name,o.color,o.qty,o.customer,o.arrived||'',m.code,o.id,o.status,o.price||0,(o.price||0)*(o.qty||0)]})].map(row=>row.map(csvEncode).join(';')).join('\r\n');const blob=new Blob(['\ufeff'+content],{type:'text/csv;charset=utf-8;'});const url=URL.createObjectURL(blob),a=document.createElement('a');a.href=url;a.download='MERCY_PO_DEMO_2026.csv';document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),2000);toast('CSV data demo berhasil dibuat.')}
function getToday(){return '2026-10-26'}
function addOrderFromForm(form){const fd=new FormData(form);const id=form.dataset.id||'PO-'+Date.now().toString().slice(-9);const date=String(fd.get('date')||getToday());const status=String(fd.get('status')||'SO');const arr=String(fd.get('arrived')||'');const obj={id,motifId:String(fd.get('motifId')),factory:String(fd.get('factory')),date,status,qty:Number(fd.get('qty'))||0,color:String(fd.get('color')),customer:String(fd.get('customer')),arrived:arr||((status==='DATANG')?getToday():''),price:Number(fd.get('price'))||0,note:String(fd.get('note')||'')};const idx=orders.findIndex(o=>o.id===id);if(idx>=0){orders[idx]=obj;toast('PO demo diperbarui.')}else{orders.unshift(obj);toast('PO demo berhasil ditambahkan.')}save();closeModal()}
function addMotifFromForm(form){const fd=new FormData(form);const name=String(fd.get('name')||'').trim(),code=String(fd.get('code')||'').trim();if(!name||!code)return toast('Nama dan kode motif wajib diisi.');const obj={id:'M-'+Date.now().toString().slice(-8),name,code,kind:String(fd.get('kind')||'Lainnya'),colors:String(fd.get('colors')||'').split(',').map(s=>s.trim()).filter(Boolean),stock:'Aktif',img:null};if(ui.pendingImage)obj.userImg=ui.pendingImage;motifs.unshift(obj);ui.selected=obj.id;ui.motifQuery='';ui.motifKind='all';ui.motifFactory='all';save();closeModal();ui.page='motifs';render();toast('Motif baru tampil di katalog demo.')}
function setPhoto(){if(!ui.pendingImage)return toast('Pilih gambar terlebih dahulu.');const id=ui.modal.id;overrides[id]=ui.pendingImage;save();closeModal();toast('Foto motif demo berhasil diperbarui.')}
function readImage(file){if(!file)return;const reader=new FileReader();reader.onload=()=>{const img=new Image();img.onload=()=>{const max=1050;const scale=Math.min(1,max/Math.max(img.width,img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round(img.width*scale));canvas.height=Math.max(1,Math.round(img.height*scale));canvas.getContext('2d').drawImage(img,0,0,canvas.width,canvas.height);ui.pendingImage=canvas.toDataURL('image/jpeg',.82);const preview=document.getElementById('motif-upload-preview');if(preview){preview.src=ui.pendingImage;preview.classList.add('shown')}toast('Foto siap disimpan dalam demo.')};img.src=reader.result};reader.readAsDataURL(file)}
function parseCSV(data){const firstLine=data.split(/\r?\n/)[0]||'';const delimiter=(firstLine.split(';').length>firstLine.split(',').length)?';':',';let rows=[],row=[],item='',inQuotes=false;for(let i=0;i<data.length;i++){const c=data[i],n=data[i+1];if(c==='"'){if(inQuotes&&n==='"'){item+='"';i++}else inQuotes=!inQuotes}else if(c===delimiter&&!inQuotes){row.push(item);item=''}else if((c==='\n'||c==='\r')&&!inQuotes){if(c==='\r'&&n==='\n')i++;row.push(item);if(row.some(x=>String(x).trim()))rows.push(row);row=[];item=''}else item+=c}row.push(item);if(row.some(x=>String(x).trim()))rows.push(row);return rows}
function convertDate(raw){const s=String(raw||'').trim();if(/^\d{4}-\d{2}-\d{2}$/.test(s))return s;const m=s.match(/^(\d{1,2})[/-](\d{1,2})[/-](\d{4})$/);if(m)return`${m[3]}-${m[2].padStart(2,'0')}-${m[1].padStart(2,'0')}`;return getToday()}
function importCSV(file){if(!file)return;const r=new FileReader();r.onload=()=>{try{const rows=parseCSV(String(r.result).replace(/^\ufeff/,''));if(rows.length<2)throw Error('CSV tidak berisi baris data');const head=rows[0].map(x=>x.trim().toUpperCase());const col=(keys)=>{for(let k of keys){const i=head.indexOf(k);if(i>=0)return i}return -1};const at=(row,keys)=>{const i=col(keys);return i===-1?'':row[i]||''};let added=0;rows.slice(1).forEach((row,i)=>{const motifName=at(row,['DESAIN','DESIGN','NAMA DESAIN']);if(!motifName)return;let m=motifs.find(x=>x.name.toLowerCase()===motifName.trim().toLowerCase());if(!m){m={id:'M-CSV-'+Date.now()+'-'+i,name:motifName.trim(),code:at(row,['KODE'])||'—',kind:'Lainnya',colors:[],img:null,stock:'Aktif'};motifs.push(m)}const factory=at(row,['PABRIK']).trim(),status=at(row,['STATUS','KET']).trim().toUpperCase();orders.push({id:at(row,['NOMOR PO','NO. PO','NO PO'])||'CSV-'+Date.now()+'-'+i,motifId:m.id,factory:factories.includes(factory)?factory:'Tridaya',date:convertDate(at(row,['TGL','TANGGAL'])),status:statuses.includes(status)?status:'SO',qty:Number(at(row,['QTY','JUMLAH PCS']).replaceAll('.',''))||0,color:at(row,['WARNA']),customer:at(row,['CUSTOMER','PELANGGAN'])||'Mercy',arrived:at(row,['BARANG DATANG'])?convertDate(at(row,['BARANG DATANG'])):'',price:Number(at(row,['HARGA']))||0,note:''});added++});save();closeModal();ui.page='orders';render();toast(`${added} PO impor ditambahkan ke data demo.`)}catch(err){const el=document.getElementById('csv-result');if(el)el.textContent='Gagal membaca CSV: '+err.message}};r.readAsText(file)}
root.addEventListener('click',e=>{const el=e.target.closest('[data-nav],[data-action]');if(!el)return;if(el.dataset.nav){navigate(el.dataset.nav);return}const action=el.dataset.action,id=el.dataset.id;
if(action==='backdrop'){if(e.target===el)closeModal();return}
if(action==='close-modal'){closeModal();return}
if(action==='global-search'){navigate('motifs');const input=root.querySelector('[data-filter="motif-query"]');input&&input.focus();return}
if(action==='settings'||action==='notifications'){openModal(action);return}
if(action==='add-motif'){openModal('motif');return}
if(action==='add-po'){openModal('po');return}
if(action==='edit-po'){openModal('po',id);return}
if(action==='import-csv'){openModal('import');return}
if(action==='export'){exportCsv();return}
if(action==='print'){window.print();return}
if(action==='select-motif'){ui.selected=id;render();return}
if(action==='motif-detail'){openModal('motif-detail',id);return}
if(action==='open-photo'){openModal('photo-zoom',id);return}
if(action==='upload-photo'){openModal('edit-photo',id);return}
if(action==='switch-view'){ui.view=el.dataset.view;render();return}
if(action==='reset-motif-filters'){ui.motifQuery='';ui.motifFactory='all';ui.motifKind='all';render();return}
if(action==='filter-po-status'){const status=el.dataset.status;if(status==='all')ui.ordersStatuses=[];else{const i=ui.ordersStatuses.indexOf(status);if(i>=0)ui.ordersStatuses.splice(i,1);else ui.ordersStatuses.push(status)}render();return}
if(action==='reset-order-filters'){ui.ordersQuery='';ui.ordersFactory='all';ui.ordersStatuses=[];render();return}
if(action==='choose-factory'){ui.factory=id;render();return}
if(action==='filter-factory-orders'){ui.ordersFactory=id;navigate('orders');return}
if(action==='mark-arrived'){const o=orders.find(x=>x.id===id);if(o){o.arrived=getToday();o.status='DATANG';save();render();toast('Barang datang dicatat di data demo.')}return}
if(action==='motif-orders'){const m=motifById(id);ui.ordersQuery=m?m.name:'';ui.ordersStatuses=[];ui.ordersFactory='all';document.body.style.overflow='';navigate('orders');return}
if(action==='delete-po'){if(window.confirm('Hapus PO ini dari data demo browser?')){orders=orders.filter(x=>x.id!==id);save();closeModal();toast('PO demo dihapus.')}return}
if(action==='reset-all'){if(window.confirm('Kembalikan semua data demo ke kondisi awal?')){motifs=JSON.parse(JSON.stringify(initialMotifs));orders=JSON.parse(JSON.stringify(initialOrders));overrides={};save();closeModal();navigate('overview');toast('Data demo telah dikembalikan.')}return}
});
root.addEventListener('change',e=>{const el=e.target;if(el.dataset.imageInput){readImage(el.files[0]);return}if(el.dataset.csvInput){importCSV(el.files[0]);return}if(!el.dataset.filter)return;const key=el.dataset.filter,v=el.value;if(key==='motif-kind')ui.motifKind=v;if(key==='motif-factory')ui.motifFactory=v;if(key==='orders-factory')ui.ordersFactory=v;if(key==='follow-factory')ui.followFactory=v;if(key==='report-factory')ui.reportFactory=v;render()});
function updateMotifSearch(){const visible=motifVisible();const wrap=root.querySelector('.library-wrap');if(!wrap)return;let selected=motifById(ui.selected);if(!selected||!visible.some(m=>m.id===selected.id)){selected=visible[0];if(selected)ui.selected=selected.id}wrap.innerHTML=`<div class="${ui.view==='grid'?'library-cards':'motif-list'}">${visible.length?visible.map(motifGridItem).join(''):`<div class="card empty" style="grid-column:1/-1">${I('search',30)}<strong>Tidak ada motif ditemukan</strong><small>Coba ubah kata kunci atau filter.</small></div>`}</div>${motifInspector(selected)}`;const count=root.querySelector('.lib-section h2 small');if(count)count.textContent=visible.length+' motifs'}
function updateOrderSearch(){const result=ordersFiltered();const el=root.querySelector('.big-table .scroll-table');if(!el)return;el.innerHTML=result.length?`<table class="status-table"><thead><tr><th>Desain / motif</th><th>No. PO / Tanggal</th><th>Pabrik</th><th>Quantity</th><th>Status</th><th>Usia PO</th><th>Barang datang</th><th>Aksi</th></tr></thead><tbody>${poTableRows(result)}</tbody></table>`:`<div class="empty"><span class="empty-icon">${I('search',26)}</span><strong>PO tidak ditemukan</strong><small>Coba ubah status, pabrik, atau pencarian.</small></div>`;const f=root.querySelector('.table-top .filter-result');if(f)f.textContent=`${result.length} dari ${orders.length} PO`;const stats=root.querySelectorAll('.po-stats strong');if(stats.length===3){stats[0].innerHTML=fmt(result.length)+' <span class="micro">PO</span>';stats[1].innerHTML=fmt(result.filter(isOpen).length)+' <span class="micro">PO</span>';stats[2].innerHTML=fmt(result.filter(o=>isOpen(o)&&days(o.date)>=30).length)+' <span class="micro">PO</span>'}}
root.addEventListener('input',e=>{if(e.target.dataset.filter==='motif-query'){ui.motifQuery=e.target.value;updateMotifSearch()}if(e.target.dataset.filter==='orders-query'){ui.ordersQuery=e.target.value;updateOrderSearch()}});
root.addEventListener('submit',e=>{const form=e.target.closest('[data-form]');if(!form)return;e.preventDefault();if(form.dataset.form==='po')addOrderFromForm(form);if(form.dataset.form==='motif')addMotifFromForm(form);if(form.dataset.form==='photo')setPhoto()});
window.addEventListener('keydown',e=>{if(e.key==='Escape'&&ui.modal)closeModal();if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){e.preventDefault();navigate('motifs');root.querySelector('[data-filter="motif-query"]')?.focus()}});
render();
</script>
